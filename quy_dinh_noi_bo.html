  :root{

  *{box-sizing:border-box;}
  body{

  }
  .wrap{max-width:1280px;margin:0 auto;padding:28px 28px 60px;}

  .masthead{

    flex-wrap:wrap;
  }
  .masthead h1{

    margin:0 0 6px;
    font-weight:800;
    letter-spacing:-0.01em;
    color:var(--navy);
  }
  .masthead p{

    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-size:var(--fs-base);
  }
  .today-tag{
    font-family:'Inter',sans-serif;
    font-size:var(--fs-sm);
    color:var(--blue-deep);
    background:#eaf1fa;
    border:1px solid #cddcef;
    padding:5px 12px;
    border-radius:20px;
    white-space:nowrap;
  }

  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:14px;
  }
  .search-box{
    flex:1;
    min-width:220px;
    position:relative;
  }
  .search-box input{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:var(--fs-base);
    padding:9px 14px 9px 34px;
    border-radius:8px;
    border:1.5px solid #cddcef;
    background:#fff;
    color:var(--ink);
  }
  .search-box input:focus{outline:none;border-color:var(--blue);}
  .search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none;}
  .search-clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);

  .filter-btn{

    font-size:var(--fs-sm);
    font-weight:600;
    padding:6px 14px;
    border-radius:20px;
    border:1px solid #cddcef;
    background:#fff;
    color:var(--blue-deep);
    cursor:pointer;
  }
  .filter-btn.active{
    background:var(--blue-deep);
    color:#fff;
    border-color:var(--blue-deep);
  }

  .empty-hint{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:var(--fs-base);
  }

    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    font-family:'Inter',sans-serif;
    font-size:var(--fs-base);
  }

    text-align:left;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--ink-soft);
    padding:8px 10px;
    border-bottom:2px solid var(--line);

    vertical-align:top;
  }

  .policy-table tr.policy-row:hover{background:#F7F9FC;}
  .policy-table tr.policy-row.is-active{background:#eaf3fc;}
  .policy-table tr.policy-row.is-active:hover{background:#dcebfa;}
  .policy-table tr.policy-row td{border-bottom:1px solid var(--line);}
  .policy-table tr.policy-row.is-open td{border-bottom-color:#c7ccd3;}
  .policy-table tr.policy-detail-row td{padding:0;}

  .col-title{min-width:0;}
  .col-title .name{font-weight:400;line-height:1.35;}
  .badge-new{
    display:inline-block;
    margin-left:6px;
    padding:1px 7px;
    border-radius:10px;
    font-size:11px;
    font-weight:700;
    vertical-align:middle;
    background:var(--new-bg);
    color:var(--new-ink);

  .col-code{letter-spacing:.02em;color:var(--ink-soft);}
  .col-stt{color:var(--ink-soft);}
  .col-dept{color:var(--ink);}

    padding:2px 8px;
    border-radius:10px;
    border:1px solid #bfe3c8;
    background:var(--active-bg);
    color:var(--active-ink);

  .policy-table td.col-range{color:var(--ink);}
  .policy-table td.col-range{white-space:normal;}

    padding:5px 11px 5px 9px;
    border-radius:20px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;

  .status.active .dot{background:var(--active-dot);}
  .status.inactive{background:var(--inactive-bg);color:var(--inactive-ink);}
  .status.inactive .dot{background:var(--inactive-dot);}

    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
    transition:transform .2s ease;
  }
  .policy-table tr.policy-row.is-open .chev{transform:rotate(180deg);}

  .policy-body-inner{padding:0 20px 22px 20px;border-top:1px solid var(--line);margin-top:0;}
  .policy-table tr.policy-detail-row.is-open .policy-body-inner{padding-top:18px;}

  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px;}

    .policy-table td.col-code{order:2;}
    .policy-table td.col-dept{order:3;}
    .policy-table td.col-updated{order:4;}
    .policy-table td.col-range{order:5;}
    .policy-table td.col-status{order:6;margin-top:4px;}
    .policy-table td.col-stt{order:7;color:var(--ink-soft);}
    .policy-table tr.policy-row td.col-chev{order:0;position:absolute;top:14px;right:16px;padding:0;}
    .policy-table tr.policy-row.is-open{border-bottom-color:#c7ccd3;}
    .policy-table td.col-updated,.policy-table td.col-range{padding-right:70px;}

    font-weight:600;

function fmtDate(d){
  return d.toLocaleDateString('vi-VN', {day:'2-digit',month:'2-digit',year:'numeric'});
}

// Parse chuỗi "dd/MM/yyyy" (field updated) thành Date để so sánh —
// không dùng localeCompare trên chuỗi ngày (sắp sai thứ tự tháng).
function parseVNDate(s){
  if(!s) return null;
  var parts = s.split('/');
  if(parts.length!==3) return null;
  return new Date(+parts[2], +parts[1]-1, +parts[0]);
}

function renderTable(t){
  if(!t) return '';
  var head = t.head.map(function(h){return '<th>'+h+'</th>';}).join('');
  var rows = t.rows.map(function(r){return '<tr>'+r.map(function(v){return '<td>'+v+'</td>';}).join('')+'</tr>';}).join('');
  return '<table class="mini"><tr>'+head+'</tr>'+rows+'</table>';
}

// Tô sáng từ khóa tìm kiếm trong văn bản hiển thị (giữ nguyên HTML tag như <b>,
// chỉ tô các đoạn text thường — đơn giản hoá: chỉ tô khi text không chứa tag).
function highlight(text, q){
  if(!q || !text || /[<>]/.test(text)) return text;
  var idx = stripDiacritics(text).indexOf(q);
  if(idx<0) return text;
  return text.slice(0,idx) + '<mark>' + text.slice(idx, idx+q.length) + '</mark>' + text.slice(idx+q.length);
}

// Gộp toàn bộ nội dung tóm tắt của 1 quy định thành 1 chuỗi phẳng để tìm từ khóa.
function flattenSearchText(p){
  var parts = [p.name, p.code, p.category, p.updated];
  (p.summary.blocks||[]).forEach(function(b){
    parts.push(b.title);
    (b.items||[]).forEach(function(i){parts.push(i);});
    if(b.table){
      parts.push(b.table.head.join(' '));
      b.table.rows.forEach(function(r){parts.push(r.join(' '));});
    }
  });
  if(p.summary.note) parts.push(p.summary.note);
  return stripDiacritics(parts.join(' | '));
}

function render(){
  document.getElementById('todayTag').textContent = 'Hôm nay: ' + fmtDate(TODAY);
  const list = document.getElementById('list');

  const categories = [...new Set(quyDinh.map(p => p.category).filter(Boolean))];
  const filterBar = document.getElementById('filterBar');
  if(categories.length > 1){
    filterBar.innerHTML = ['', ...categories].map(c => {
      const label = c === '' ? 'Tất cả' : c;
      const isOn = activeCategory === c;
      return `<button class="filter-btn${isOn?' active':''}" onclick="setCategory('${c.replace(/'/g,"\\'")}')">${label}</button>`;
    }).join('');
  } else {
    filterBar.innerHTML = '';
  }

  const q = stripDiacritics(searchQuery.trim());

  const threeMonthsAgo = new Date(TODAY.getFullYear(), TODAY.getMonth() - 3, TODAY.getDate());
  const withStatus = quyDinh
    .map((p, originalIdx) => {
      const isActive = TODAY >= p.from && (p.to === null || TODAY <= p.to);
      const updatedDate = parseVNDate(p.updated);
      const isNew = isActive && updatedDate !== null && updatedDate >= threeMonthsAgo;
      return { p, originalIdx, isActive, isNew };
    })
    .filter(({ p }) => !activeCategory || p.category === activeCategory)
    .filter(({ p }) => !q || flattenSearchText(p).indexOf(q) >= 0);

  withStatus.sort((a, b) => {
    if (a.isActive !== b.isActive) return a.isActive ? -1 : 1;
    return parseVNDate(b.p.updated) - parseVNDate(a.p.updated);
  });

  if(!withStatus.length){
    list.innerHTML = '<div class="empty-hint">Không tìm thấy quy định nào khớp với bộ lọc/từ khóa hiện tại.</div>';
    return;
  }

  const rows = withStatus.map(({ p, originalIdx, isActive, isNew }, displayIdx) => {
    const i = originalIdx;
    const stt = displayIdx + 1;
    return `
    <tr class="policy-row${isActive ? ' is-active' : ''}" data-idx="${i}" onclick="toggle(${i})">
      <td class="col-stt">${stt}</td>
      <td class="col-dept">${isActive ? `<span class="dept-pill">${p.category || '—'}</span>` : (p.category || '—')}</td>
      <td class="col-title">
        <div class="name">${highlight(p.name, q)}${isNew ? '<span class="badge-new">Mới</span>' : ''}</div>
      </td>
      <td class="col-code">${highlight(p.code || '—', q)}</td>
      <td class="col-updated">${p.updated}</td>
      <td class="col-range">${p.fromLabel} — ${p.toLabel}</td>
      <td class="col-status">
        <span class="status ${isActive ? 'active' : 'inactive'}">
          <span class="dot"></span>${isActive ? 'Đang áp dụng' : 'Hết hiệu lực'}
        </span>
      </td>
      <td class="col-chev">
        <span class="chev">
          <svg width="12" height="8" viewBox="0 0 12 8" fill="none"><path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </td>
    </tr>
    <tr class="policy-detail-row" data-idx="${i}">
      <td colspan="8">
        <div class="policy-body" id="body-${i}">
          <div class="policy-body-inner">
            <div class="summary-grid">
              ${(p.summary.blocks||[]).map(b => `<div class="block">
                <h4>${b.title}</h4>
                ${(b.items && b.items.length) ? `<ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>` : ''}
                ${renderTable(b.table)}
              </div>`).join('')}
              ${p.summary.note ? `<div class="note">${p.summary.note}</div>` : ''}
              <div class="source-row">
                ${p.docUrl
                  ? `<a class="doc-btn" href="${p.docUrl}" target="_blank" rel="noopener">
                       <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z" stroke="currentColor" stroke-width="1.6"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.6"/></svg>
                       ${p.docLabel || 'Xem file gốc (Word, mở trên Google Drive)'}
                     </a>`
                  : `<span class="doc-unavailable">Chưa có file gốc đính kèm</span>`
                }
              </div>
            </div>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');

  list.innerHTML = `
    <table class="policy-table">
      <colgroup>
        <col style="width:40px">
        <col style="width:150px">
        <col>
        <col style="width:110px">
        <col style="width:100px">
        <col style="width:210px">
        <col style="width:120px">
        <col style="width:36px">
      </colgroup>
      <thead>
        <tr>
          <th>STT</th>
          <th>Phân loại</th>
          <th>Quy định</th>
          <th>Số hiệu</th>
          <th>Ngày cập nhật</th>
          <th>Hiệu lực áp dụng</th>
          <th>Trạng thái</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function setCategory(c){
  activeCategory = c;
  render();
}

function setSearch(v){
  searchQuery = v;
  document.getElementById('searchClearBtn').style.display = v ? 'block' : 'none';
  render();
}

function clearSearch(){
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClearBtn').style.display = 'none';
  render();
}

function toggle(i){
  const row = document.querySelector(`tr.policy-row[data-idx="${i}"]`);
  const detailRow = document.querySelector(`tr.policy-detail-row[data-idx="${i}"]`);
  const body = document.getElementById(`body-${i}`);
  const isOpen = row.classList.contains('is-open');
  if(isOpen){
    body.style.maxHeight = null;
    row.classList.remove('is-open');
    detailRow.classList.remove('is-open');
  } else {
    row.classList.add('is-open');
    detailRow.classList.add('is-open');
    body.style.maxHeight = body.scrollHeight + 'px';
  }
}

render();
</script>
</body>
</html>
