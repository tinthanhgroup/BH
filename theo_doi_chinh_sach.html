<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cập nhật chính sách HTV</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --ink:#1c2430;
    --ink-soft:#5b6472;
    --line:#dfe3e8;
    --bg:#EEF3F9;
    --card:#ffffff;
    --blue:#0f4c92;
    --blue-deep:#0a3866;
    --navy:#1B4F8C;
    --active-bg:#eaf6ee;
    --active-ink:#1c7a3e;
    --active-dot:#2ea44f;
    --inactive-bg:#f3f1ee;
    --inactive-ink:#8a8378;
    --inactive-dot:#b8b0a3;
    /* Hệ thống cỡ chữ dùng chung — hạn chế số lượng cỡ chữ khác nhau trên trang,
       chỉ 5 mức thay vì mỗi chỗ 1 giá trị lẻ (10.5/11/11.5/12/12.5/13/13.5/14/14.5px). */
    --fs-h1:24px;
    --fs-md:14px;
    --fs-base:13px;
    --fs-sm:12px;
    --fs-xs:11px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:28px 28px 60px;}

  .masthead{
    padding-bottom:18px;
    margin-bottom:28px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
  }
  .masthead h1{
    font-size:var(--fs-h1);
    margin:0 0 6px;
    font-weight:800;
    letter-spacing:-0.01em;
    color:var(--navy);
  }
  .masthead p{
    margin:0;
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-size:var(--fs-base);
  }
  .today-tag{
    font-family:'Inter',sans-serif;
    font-size:var(--fs-sm);
    color:var(--blue-deep);
    background:#eaf1fa;
    border:1px solid #cddcef;
    padding:5px 12px;
    border-radius:20px;
    white-space:nowrap;
  }

  /* ── Bảng danh sách chính sách ─────────────────────────────
     1 hàng tiêu đề duy nhất (Chính sách/Ngày cập nhật/Thời gian áp
     dụng/Trạng thái) thay vì lặp lại nhãn cột trên từng dòng — và vì
     là 1 bảng thật, các cột luôn thẳng hàng xuống mọi dòng. */
  .policy-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    font-family:'Inter',sans-serif;
    font-size:var(--fs-base);
  }
  .policy-table thead th{
    text-align:left;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--ink-soft);
    padding:8px 10px;
    border-bottom:2px solid var(--line);
  }
  .policy-table tbody td{
    padding:10px;
    vertical-align:top;
  }
  .policy-table tr.policy-row{cursor:pointer;transition:background .15s ease;}
  .policy-table tr.policy-row:hover{background:#F7F9FC;}
  .policy-table tr.policy-row.is-active{background:#eaf3fc;}
  .policy-table tr.policy-row.is-active:hover{background:#dcebfa;}
  .policy-table tr.policy-row td{border-bottom:1px solid var(--line);}
  .policy-table tr.policy-row.is-open td{border-bottom-color:#c7ccd3;}
  .policy-table tr.policy-detail-row td{padding:0;}

  .col-title{min-width:0;}
  .col-title .name{
    font-weight:400;
    line-height:1.35;
  }
  .important-badge{
    display:inline-block;
    margin-left:6px;
    padding:1px 7px;
    border-radius:8px;
    font-size:var(--fs-xs);
    font-weight:700;
    vertical-align:middle;
    border:1px solid #a9cdf0;
    background:#dbe9fb;
    color:var(--blue-deep);
  }
  /* Badge "Mới" — chỉ hiện trong 3 ngày kể từ ngày `updated`, tự ẩn sau đó
     (tính theo TODAY, xem hàm isNewPolicy()) */
  .new-badge{
    display:inline-block;
    margin-left:6px;
    padding:1px 7px;
    border-radius:8px;
    font-size:var(--fs-xs);
    font-weight:700;
    vertical-align:middle;
    border:1px solid #f3b8a3;
    background:#fdeae3;
    color:#c0421f;
  }
  .col-code{
    letter-spacing:.02em;
    color:var(--ink-soft);
  }
  .col-stt{color:var(--ink-soft);}
  .col-dept{color:var(--ink);}
  .col-dept .dept-pill{
    display:inline-block;
    padding:2px 8px;
    border-radius:10px;
    border:1px solid #bfe3c8;
    background:var(--active-bg);
    color:var(--active-ink);
  }

  .filter-bar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .filter-btn{
    font-family:inherit;
    font-size:var(--fs-sm);
    font-weight:600;
    padding:6px 14px;
    border-radius:20px;
    border:1px solid #cddcef;
    background:#fff;
    color:var(--blue-deep);
    cursor:pointer;
  }
  .filter-btn.active{
    background:var(--blue-deep);
    color:#fff;
    border-color:var(--blue-deep);
  }

  /* Cột "Ngày cập nhật"/"Thời gian áp dụng" — nhãn cột giờ chỉ nằm ở
     hàng tiêu đề (thead), các ô này chỉ chứa giá trị, không lặp nhãn. */
  .policy-table td.col-updated,
  .policy-table td.col-range{
    color:var(--ink);
  }
  /* Độ dài "Thời gian áp dụng" khác nhau nhiều giữa các chính sách
     (VD "31/12/2026" ngắn vs "Đến khi có công văn điều chỉnh" dài) —
     cho phép xuống dòng trong đúng độ rộng cột cố định của colgroup. */
  .policy-table td.col-range{white-space:normal;}

  .status{
    font-weight:600;
    padding:5px 11px 5px 9px;
    border-radius:20px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .status .dot{width:6px;height:6px;border-radius:50%;}
  .status.active{background:var(--active-bg);color:var(--active-ink);}
  .status.active .dot{background:var(--active-dot);}
  .status.inactive{background:var(--inactive-bg);color:var(--inactive-ink);}
  .status.inactive .dot{background:var(--inactive-dot);}

  .chev{
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
    transition:transform .2s ease;
  }
  .policy-table tr.policy-row.is-open .chev{transform:rotate(180deg);}

  .policy-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .policy-body-inner{
    padding:0 20px 22px 20px;
    border-top:1px solid var(--line);
    margin-top:0;
  }
  .policy-table tr.policy-detail-row.is-open .policy-body-inner{padding-top:18px;}

  .summary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px 28px;
  }
  @media (max-width:640px){
    .summary-grid{grid-template-columns:1fr;}
    /* Bảng không đủ chỗ trên màn hình hẹp — chuyển từng dòng thành 1 khối
       xếp dọc (thead ẩn đi), và hiện lại nhãn cột ngay trước giá trị vì
       không còn hàng tiêu đề chung để tham chiếu. */
    .policy-table, .policy-table tbody, .policy-table td, .policy-table tr.policy-detail-row{display:block;width:auto!important;}
    .policy-table thead{display:none;}
    /* Xếp lại thứ tự hiển thị bằng flex order — tiêu đề chính sách lên
       đầu tiên cho dễ đọc, thay vì đúng thứ tự cột STT/Phòng ban.../Chính sách. */
    .policy-table tr.policy-row{display:flex;flex-direction:column;padding:14px 16px;position:relative;border-bottom:1px solid var(--line);}
    .policy-table tr.policy-row td{border-bottom:none;padding:2px 0;}
    .policy-table td.col-title{order:1;}
    .policy-table td.col-code{order:2;}
    .policy-table td.col-dept{order:3;}
    .policy-table td.col-updated{order:4;}
    .policy-table td.col-range{order:5;}
    .policy-table td.col-status{order:6;margin-top:4px;}
    .policy-table td.col-stt{order:7;color:var(--ink-soft);}
    .policy-table tr.policy-row td.col-chev{order:0;position:absolute;top:14px;right:16px;padding:0;}
    .policy-table tr.policy-row.is-open{border-bottom-color:#c7ccd3;}
    .policy-table td.col-updated,.policy-table td.col-range{padding-right:70px;}
    .policy-table td.col-stt::before{content:"STT ";font-weight:600;color:var(--ink-soft);}
    .policy-table td.col-dept::before{content:"Phòng ban: ";font-weight:600;color:var(--ink-soft);}
    .policy-table td.col-updated::before{content:"Ngày cập nhật: ";font-weight:600;color:var(--ink-soft);}
    .policy-table td.col-range::before{content:"Thời gian áp dụng: ";font-weight:600;color:var(--ink-soft);}
  }

  .block h4{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:var(--fs-xs);
    font-weight:700;
    color:var(--blue-deep);
    margin:0 0 8px;
  }
  .block ul{
    margin:0;
    padding-left:18px;
    font-size:var(--fs-md);
    line-height:1.65;
  }
  .block li{margin-bottom:5px;}
  .block li b{font-weight:700;}
  .block table.mini{
    width:100%;
    border-collapse:collapse;
    font-size:var(--fs-base);
    margin-top:2px;
  }
  .block table.mini th, .block table.mini td{
    border:1px solid var(--line);
    padding:5px 8px;
    text-align:center;
  }
  .block table.mini th{
    background:#f5f6f8;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:600;
    font-size:var(--fs-xs);
    color:var(--ink-soft);
  }

  .note{
    grid-column:1 / -1;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);
    color:var(--ink-soft);
    background:#f8f7f4;
    border-left:2px solid var(--blue);
    padding:9px 12px;
    margin-top:2px;
  }

  .source-row{
    grid-column:1 / -1;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    flex-wrap:wrap;
    gap:8px;
    margin-top:4px;
  }
  .pdf-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);
    font-weight:600;
    color:var(--blue-deep);
    background:#fff;
    border:1px solid #c7d3e2;
    padding:7px 13px;
    border-radius:5px;
    text-decoration:none;
    transition:background .15s ease, border-color .15s ease;
  }
  .pdf-btn:hover{background:#eef3fa;border-color:var(--blue);}
  .pdf-btn svg{flex-shrink:0;}
  .pdf-unavailable{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:var(--fs-sm);
    color:#a9aeb6;
    font-style:italic;
  }

  .foot{
    text-align:center;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:var(--fs-xs);
    color:#a9aeb6;
    margin-top:34px;
  }
</style>
</head>

        "<b>Mức 3</b>: điểm DRP ≥95% + đạt chỉ tiêu xe hết bảo hành vào làm dịch vụ → thưởng <b>6%</b>",
        "Giá trị tính thưởng = doanh số tính thưởng thực tế, không vượt quá chỉ tiêu Phụ tùng/Dầu nhớt/Hóa chất đã đăng ký"
      ],
      thang: [
        "<b>Mức 1</b>: DRP ≥80%, CSI/NPS dịch vụ ≥ chỉ tiêu hệ thống, không yêu cầu xe hết bảo hành → <b>80 triệu đồng</b>",
        "<b>Mức 2</b>: DRP 90–&lt;95%, CSI/NPS ≥ chỉ tiêu thách thức, đạt chỉ tiêu xe hết bảo hành → <b>120 triệu đồng</b>",
        "<b>Mức 3</b>: DRP ≥95%, CSI/NPS ≥ chỉ tiêu thách thức, đạt chỉ tiêu xe hết bảo hành → <b>200 triệu đồng</b>",
        "Giải ngân: 50% tạm ứng tiền mặt sau khi HTV xác nhận, 50% còn lại cho chương trình tái đầu tư Xưởng dịch vụ (có giám sát HTV) — trong 30 ngày kể từ khi HTV nhận đủ hồ sơ"
      ],
      note: "Chế tài: cố ý làm sai lệch dữ liệu DMS để trục lợi → hoàn trả toàn bộ tiền đã nhận + có thể bị tạm dừng xét thưởng kỳ sau; hồ sơ không đầy đủ/không đúng hạn → HTV không giải ngân. Ký ngày 09/01/2026 bởi Giám đốc Bộ phận Dịch vụ Nguyễn Khánh Linh. Đã được thay thế hoàn toàn bởi Chính sách số 95/2026/CV-HTV (ký 14/09/2026, áp dụng từ 01/07/2026) — không còn áp dụng cho nửa cuối năm 2026, chỉ lưu để đối chiếu lịch sử."
    }
  }
];

function fmtDate(d){
  return d.toLocaleDateString('vi-VN', {day:'2-digit',month:'2-digit',year:'numeric'});
}

// Parse chuỗi "dd/MM/yyyy" (field updated) thành Date để so sánh —
// không dùng localeCompare trên chuỗi ngày (sắp sai thứ tự tháng).
function parseVNDate(s){
  if(!s) return null;
  var parts = s.split('/');
  if(parts.length!==3) return null;
  return new Date(+parts[2], +parts[1]-1, +parts[0]);
}

// Badge "Mới": hiện đúng 3 ngày kể từ ngày `updated`, tự ẩn sau đó — so theo TODAY,
// không hardcode ngày hết hạn badge ở đâu khác.
const NEW_BADGE_DAYS = 3;
function isNewPolicy(p){
  const d = parseVNDate(p.updated);
  if(!d) return false;
  const diffDays = (TODAY - d) / (24*60*60*1000);
  return diffDays >= 0 && diffDays <= NEW_BADGE_DAYS;
}

function renderTable(t){
  if(!t) return '';
  let head = t.head.map(h=>`<th>${h}</th>`).join('');
  let row = t.row.map(v=>`<td>${v}</td>`).join('');
  return `<table class="mini"><tr>${head}</tr><tr>${row}</tr></table>`;
}

function render(){
  document.getElementById('todayTag').textContent = 'Hôm nay: ' + fmtDate(TODAY);
  const list = document.getElementById('list');

  // Dựng bộ lọc phân loại từ danh sách category thực có trong policies
  const categories = [...new Set(policies.map(p => p.category).filter(Boolean))];
  const filterBar = document.getElementById('filterBar');
  if(categories.length > 1){
    filterBar.innerHTML = ['', ...categories].map(c => {
      const label = c === '' ? 'Tất cả' : c;
      const isOn = activeCategory === c;
      return `<button class="filter-btn${isOn?' active':''}" onclick="setCategory('${c.replace(/'/g,"\\'")}')">${label}</button>`;
    }).join('');
  } else {
    filterBar.innerHTML = '';
  }

  // Gắn trạng thái Active/Inactive và chỉ số gốc vào mỗi chính sách, lọc theo phân loại đang chọn
  const withStatus = policies
    .map((p, originalIdx) => {
      const isActive = TODAY >= p.from && (p.to === null || TODAY <= p.to);
      return { p, originalIdx, isActive };
    })
    .filter(({ p }) => !activeCategory || p.category === activeCategory);

  // Sắp xếp: Active trước Inactive; trong mỗi nhóm, ngày cập nhật gần nhất lên trên
  withStatus.sort((a, b) => {
    if (a.isActive !== b.isActive) return a.isActive ? -1 : 1;
    return parseVNDate(b.p.updated) - parseVNDate(a.p.updated);
  });

  const rows = withStatus.map(({ p, originalIdx, isActive }, displayIdx) => {
    const i = originalIdx;
    const stt = displayIdx + 1;
    return `
    <tr class="policy-row${isActive ? ' is-active' : ''}" data-idx="${i}" onclick="toggle(${i})">
      <td class="col-stt">${stt}</td>
      <td class="col-dept">${isActive ? `<span class="dept-pill">${p.category || '—'}</span>` : (p.category || '—')}</td>
      <td class="col-title">
        <div class="name">${p.name}${p.important ? ' <span class="important-badge">⭐ Nổi bật</span>' : ''}${isNewPolicy(p) ? ' <span class="new-badge">🆕 Mới</span>' : ''}</div>
      </td>
      <td class="col-code">${(p.code || '').split(' · ')[0]}</td>
      <td class="col-updated">${p.updated}</td>
      <td class="col-range">${p.fromLabel} — ${p.toLabel}</td>
      <td class="col-status">
        <span class="status ${isActive ? 'active' : 'inactive'}">
          <span class="dot"></span>${isActive ? 'Active' : 'Inactive'}
        </span>
      </td>
      <td class="col-chev">
        <span class="chev">
          <svg width="12" height="8" viewBox="0 0 12 8" fill="none"><path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </td>
    </tr>
    <tr class="policy-detail-row" data-idx="${i}">
      <td colspan="8">
        <div class="policy-body" id="body-${i}">
          <div class="policy-body-inner">
            <div class="summary-grid">
              ${(p.summary.quy && p.summary.quy.length) ? `<div class="block">
                <h4>${p.summary.quyLabel || 'NỘI DUNG CHÍNH'}</h4>
                <ul>${p.summary.quy.map(x=>`<li>${x}</li>`).join('')}</ul>
                ${renderTable(p.summary.quyTable)}
              </div>` : ''}
              ${(p.summary.thang && p.summary.thang.length) ? `<div class="block">
                <h4>${p.summary.thangLabel || 'THÊM'}</h4>
                <ul>${p.summary.thang.map(x=>`<li>${x}</li>`).join('')}</ul>
                ${renderTable(p.summary.thangTable)}
              </div>` : ''}
              ${p.summary.note ? `<div class="note">${p.summary.note}</div>` : ''}
              <div class="source-row">
                ${p.pdfUrl
                  ? `<a class="pdf-btn" href="${p.pdfUrl}" target="_blank" rel="noopener">
                       <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z" stroke="currentColor" stroke-width="1.6"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.6"/></svg>
                       ${p.pdfLabel || 'Xem chính sách gốc (PDF, mở trên Google Drive)'}
                     </a>`
                  : `<span class="pdf-unavailable">Chưa có file gốc đính kèm</span>`
                }
                ${(p.extraLinks || []).map(l => `<a class="pdf-btn" href="${l.url}" target="_blank" rel="noopener">
                       <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z" stroke="currentColor" stroke-width="1.6"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.6"/></svg>
                       ${l.label}
                     </a>`).join('')}
              </div>
            </div>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');

  list.innerHTML = `
    <table class="policy-table">
      <colgroup>
        <col style="width:40px">
        <col style="width:150px">
        <col>
        <col style="width:200px">
        <col style="width:130px">
        <col style="width:230px">
        <col style="width:96px">
        <col style="width:36px">
      </colgroup>
      <thead>
        <tr>
          <th>STT</th>
          <th>Phòng ban</th>
          <th>Chính sách</th>
          <th>Số công văn</th>
          <th>Ngày cập nhật</th>
          <th>Thời gian áp dụng</th>
          <th>Trạng thái</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function setCategory(c){
  activeCategory = c;
  render();
}

function toggle(i){
  const row = document.querySelector(`tr.policy-row[data-idx="${i}"]`);
  const detailRow = document.querySelector(`tr.policy-detail-row[data-idx="${i}"]`);
  const body = document.getElementById(`body-${i}`);
  const isOpen = row.classList.contains('is-open');
  if(isOpen){
    body.style.maxHeight = null;
    row.classList.remove('is-open');
    detailRow.classList.remove('is-open');
  } else {
    row.classList.add('is-open');
    detailRow.classList.add('is-open');
    body.style.maxHeight = body.scrollHeight + 'px';
  }
}

render();
</script>
</body>
</html>
