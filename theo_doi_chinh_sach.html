<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cập nhật chính sách HTV</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --ink:#1c2430;
    --ink-soft:#5b6472;
    --line:#dfe3e8;
    --paper:#fbfaf8;
    --card:#ffffff;
    --blue:#0f4c92;
    --blue-deep:#0a3866;
    --active-bg:#eaf6ee;
    --active-ink:#1c7a3e;
    --active-dot:#2ea44f;
    --inactive-bg:#f3f1ee;
    --inactive-ink:#8a8378;
    --inactive-dot:#b8b0a3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:40px 20px 80px;
  }
  .wrap{max-width:880px;margin:0 auto;}

  .masthead{
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:28px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
  }
  .masthead h1{
    font-size:26px;
    margin:0 0 6px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .masthead p{
    margin:0;
    color:var(--ink-soft);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:13.5px;
  }
  .today-tag{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:12.5px;
    color:var(--blue-deep);
    background:#eaf1fa;
    border:1px solid #cddcef;
    padding:5px 12px;
    border-radius:20px;
    white-space:nowrap;
  }

  .policy{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    margin-bottom:14px;
    overflow:hidden;
    transition:border-color .15s ease;
  }
  .policy.is-open{border-color:#c7ccd3;}

  .policy-head{
    width:100%;
    display:grid;
    grid-template-columns:1fr auto auto auto 22px;
    gap:20px;
    align-items:center;
    padding:18px 20px;
    background:none;
    border:none;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    color:inherit;
  }
  .policy-head:hover{background:#fafafa;}

  .col-title{min-width:0;}
  .col-title .stt{
    font-weight:700;
    color:var(--blue-deep);
  }
  .col-title .code{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:11px;
    letter-spacing:.02em;
    color:var(--ink-soft);
    margin-bottom:3px;
  }
  .col-title .name{
    font-size:16.5px;
    font-weight:700;
    line-height:1.35;
  }
  .col-title .cat{
    display:inline-block;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--blue-deep);
    background:#eaf1fa;
    border:1px solid #cddcef;
    padding:2px 8px;
    border-radius:10px;
    margin-top:6px;
  }

  .filter-bar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .filter-btn{
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    padding:6px 14px;
    border-radius:20px;
    border:1px solid #cddcef;
    background:#fff;
    color:var(--blue-deep);
    cursor:pointer;
  }
  .filter-btn.active{
    background:var(--blue-deep);
    color:#fff;
    border-color:var(--blue-deep);
  }

  .col-meta{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:12.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .col-meta .k{display:block;font-size:10.5px;text-transform:none;color:#9aa1ab;margin-bottom:2px;}
  .col-meta .v{color:var(--ink);font-size:13px;}

  .status{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:12px;
    font-weight:600;
    padding:5px 11px 5px 9px;
    border-radius:20px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .status .dot{width:6px;height:6px;border-radius:50%;}
  .status.active{background:var(--active-bg);color:var(--active-ink);}
  .status.active .dot{background:var(--active-dot);}
  .status.inactive{background:var(--inactive-bg);color:var(--inactive-ink);}
  .status.inactive .dot{background:var(--inactive-dot);}

  .chev{
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
    transition:transform .2s ease;
  }
  .policy.is-open .chev{transform:rotate(180deg);}

  .policy-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .policy-body-inner{
    padding:0 20px 22px 20px;
    border-top:1px solid var(--line);
    margin-top:0;
  }
  .policy.is-open .policy-body-inner{padding-top:18px;}

  .summary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px 28px;
  }
  @media (max-width:640px){
    .summary-grid{grid-template-columns:1fr;}
    .policy-head{grid-template-columns:1fr auto;grid-template-areas:"title chev" "meta meta" "status status";}
    .col-title{grid-area:title;}
    .chev{grid-area:chev;}
    .col-meta{grid-area:meta;}
    .status{grid-area:status;justify-self:start;margin-top:4px;}
  }

  .block h4{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:11.5px;
    font-weight:700;
    color:var(--blue-deep);
    margin:0 0 8px;
  }
  .block ul{
    margin:0;
    padding-left:18px;
    font-size:14px;
    line-height:1.65;
  }
  .block li{margin-bottom:5px;}
  .block li b{font-weight:700;}
  .block table.mini{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    margin-top:2px;
  }
  .block table.mini th, .block table.mini td{
    border:1px solid var(--line);
    padding:5px 8px;
    text-align:center;
  }
  .block table.mini th{
    background:#f5f6f8;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:600;
    font-size:11px;
    color:var(--ink-soft);
  }

  .note{
    grid-column:1 / -1;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    background:#f8f7f4;
    border-left:2px solid var(--blue);
    padding:9px 12px;
    margin-top:2px;
  }

  .source-row{
    grid-column:1 / -1;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin-top:4px;
  }
  .pdf-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:12.5px;
    font-weight:600;
    color:var(--blue-deep);
    background:#fff;
    border:1px solid #c7d3e2;
    padding:7px 13px;
    border-radius:5px;
    text-decoration:none;
    transition:background .15s ease, border-color .15s ease;
  }
  .pdf-btn:hover{background:#eef3fa;border-color:var(--blue);}
  .pdf-btn svg{flex-shrink:0;}
  .pdf-unavailable{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:12px;
    color:#a9aeb6;
    font-style:italic;
  }

  .foot{
    text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:11.5px;
    color:#a9aeb6;
    margin-top:34px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>Cập nhật chính sách HTV</h1>
      <p>Hyundai Thành Công Việt Nam · Danh mục công văn theo hiệu lực áp dụng</p>
    </div>
    <div class="today-tag" id="todayTag"></div>
  </div>

  <div class="filter-bar" id="filterBar"></div>

  <div id="list"></div>

  <div class="foot">Nhấn vào từng chính sách để xem tóm tắt chi tiết</div>
</div>

<script>
const TODAY = new Date(); // luôn lấy đúng ngày thực tế khi mở file
let activeCategory = ''; // '' = tất cả

const policies = [
  {
    pdfUrl: "https://drive.google.com/file/d/1qf-3Fveq1oset83msy3SkeC_ZrC4XBiP/view?usp=drive_link",
    category: "Bán hàng - Marketing",
    code: "Số 52/2026/CV-HTV · Ký ngày 06/07/2026",
    name: "Chính sách Thưởng kinh doanh (Quý & Tháng)",
    updated: "06/07/2026",
    from: new Date(2026,6,1),
    to: new Date(2026,11,31),
    toLabel: "31/12/2026",
    fromLabel: "01/07/2026",
    summary: {
      quy: [
        "A = DS xác thực quý / Chỉ tiêu quý ×100%. A&lt;90%: không thưởng.",
        "A≥90%: <b>T = 100 triệu + (H × 0.7% × Doanh thu tính thưởng)</b>",
        "Giải ngân: 75% ngay, 25% còn lại (Q3, Q4) xét khi 6 tháng cuối năm ≥90% chỉ tiêu"
      ],
      quyTable: {head:["A","≥90%","≥95%","≥100%","≥120%","≥150%"], row:["H",0.75,0.95,1.1,1.25,1.5]},
      thang: [
        "A' = DS xác thực tháng / Chỉ tiêu tháng ×100%. A'&lt;90%: không thưởng.",
        "A'≥90%: <b>T = H × 0.2% × Doanh thu tính thưởng</b>",
        "Giải ngân 100%, trả sau khi kết thúc mỗi Quý"
      ],
      note: "Thưởng Quý bị trừ đi phần đã nhận theo Tháng trong quý đó. Không tính xe LX3 vào doanh thu tính thưởng (bổ sung ngoài văn bản gốc — cần xác nhận lại bằng văn bản chính thức)."
    }
  },
  {
    pdfUrl: "https://drive.google.com/file/d/17t-nTU0C4G7OBT9srDW3xERY8qCHaJ7_/view?usp=drive_link",
    category: "Bán hàng - Marketing",
    code: "Thông báo điều chỉnh · Cập nhật ngày 06/07/2026 (đã thay thế)",
    name: "Chính sách Hỗ trợ Marketing Đại lý — bản 06/07",
    updated: "06/07/2026",
    from: new Date(2026,6,1),
    to: new Date(2026,6,22),
    toLabel: "22/07/2026 (bị thay thế)",
    fromLabel: "01/07/2026",
    summary: {
      quy: [
        "<b>Hạn mức Hỗ trợ Marketing = A × B</b> (A theo % hoàn thành bán hàng tháng, B = số xe báo bán DMS)",
        "Điều kiện: đạt KPI bắt buộc + HTBH ≥80% + Data khách hàng ≥80% chỉ tiêu",
        "HTV hỗ trợ <b>không vượt quá 60%</b> chi phí Marketing thực tế hợp lệ"
      ],
      quyTable: {head:["HTBH","80–90%","≥90%"], row:["Mức A","1.3tr","1.5tr"]},
      thang: [
        "Giải ngân <b>tạm ứng theo tuần</b>: 60% × 1.3 triệu/xe báo bán xuất hóa đơn trên DMS trong kỳ",
        "Chốt giải ngân cuối cùng theo tháng, dựa trên kết quả bán hàng + chương trình Marketing hợp lệ, thanh toán trong 15 ngày sau khi xuất hóa đơn",
        "Kèm 4 Phụ lục: (1) khoản chi được/không được hỗ trợ, (2) tiêu chuẩn tối thiểu từng loại hình MKT, (3)(4) quy trình đăng ký & báo cáo"
      ],
      note: "Đã được thay thế bởi bản cập nhật ngày 23/07/2026 — không còn áp dụng, chỉ lưu để đối chiếu lịch sử."
    }
  },
  {
    pdfUrl: "https://drive.google.com/file/d/1UDg9k0cS7f9WRhxshyZ9zbzsL8QP4c5Q/view?usp=drive_link",
    category: "Bán hàng - Marketing",
    code: "Thông báo điều chỉnh · Cập nhật ngày 23/07/2026",
    name: "Chính sách Hỗ trợ Marketing Đại lý — bản 23/07",
    updated: "23/07/2026",
    from: new Date(2026,6,23),
    to: null,
    toLabel: "Đến khi có công văn điều chỉnh",
    fromLabel: "23/07/2026",
    summary: {
      quy: [
        "<b>Hạn mức Hỗ trợ Marketing = A × B</b> (A theo % hoàn thành bán hàng tháng, B = số xe báo bán DMS)",
        "Điều kiện: đạt KPI bắt buộc + HTBH ≥60% + Data khách hàng ≥80% chỉ tiêu",
        "Hỗ trợ thực nhận = chi phí Marketing hợp lệ thực tế (tối đa <b>100%</b> hạn mức)"
      ],
      quyTable: {head:["HTBH","≥90%","80–90%","70–80%","60–70%"], row:["Mức A","1.5tr","1.3tr","1tr","700k"]},
      thang: [
        "Cơ chế sử dụng: ≥75% Marketing chung, 25% hỗ trợ quảng cáo TVBH",
        "Giải ngân hỗ trợ tháng: trong 15 ngày kể từ khi xuất hóa đơn",
        "Chiến dịch riêng (FB/TikTok, trưng bày, lái thử): 5–20 triệu/chiến dịch, giải ngân sau khi kết quý"
      ],
      note: "Thay thế bản 06/07/2026 — nới ngưỡng HTBH về 60% và nâng trần hỗ trợ lên 100%, quay lại giải ngân theo tháng."
    }
  }
];

function fmtDate(d){
  return d.toLocaleDateString('vi-VN', {day:'2-digit',month:'2-digit',year:'numeric'});
}

function renderTable(t){
  if(!t) return '';
  let head = t.head.map(h=>`<th>${h}</th>`).join('');
  let row = t.row.map(v=>`<td>${v}</td>`).join('');
  return `<table class="mini"><tr>${head}</tr><tr>${row}</tr></table>`;
}

function render(){
  document.getElementById('todayTag').textContent = 'Hôm nay: ' + fmtDate(TODAY);
  const list = document.getElementById('list');

  // Dựng bộ lọc phân loại từ danh sách category thực có trong policies
  const categories = [...new Set(policies.map(p => p.category).filter(Boolean))];
  const filterBar = document.getElementById('filterBar');
  if(categories.length > 1){
    filterBar.innerHTML = ['', ...categories].map(c => {
      const label = c === '' ? 'Tất cả' : c;
      const isOn = activeCategory === c;
      return `<button class="filter-btn${isOn?' active':''}" onclick="setCategory('${c.replace(/'/g,"\\'")}')">${label}</button>`;
    }).join('');
  } else {
    filterBar.innerHTML = '';
  }

  // Gắn trạng thái Active/Inactive và chỉ số gốc vào mỗi chính sách, lọc theo phân loại đang chọn
  const withStatus = policies
    .map((p, originalIdx) => {
      const isActive = TODAY >= p.from && (p.to === null || TODAY <= p.to);
      return { p, originalIdx, isActive };
    })
    .filter(({ p }) => !activeCategory || p.category === activeCategory);

  // Sắp xếp: Active trước Inactive; trong mỗi nhóm, ngày cập nhật gần nhất lên trên
  withStatus.sort((a, b) => {
    if (a.isActive !== b.isActive) return a.isActive ? -1 : 1;
    return b.p.from - a.p.from;
  });

  list.innerHTML = withStatus.map(({ p, originalIdx, isActive }, displayIdx) => {
    const i = originalIdx;
    const stt = displayIdx + 1;
    void 0; // isActive đã được tính sẵn ở bước sắp xếp phía trên
    return `
    <div class="policy" data-idx="${i}">
      <button class="policy-head" onclick="toggle(${i})">
        <div class="col-title">
          <div class="code"><span class="stt">${stt}.</span> ${p.code}</div>
          <div class="name">${p.name}</div>
          ${p.category ? `<div class="cat">${p.category}</div>` : ''}
        </div>
        <div class="col-meta">
          <span class="k">Ngày cập nhật</span>
          <span class="v">${p.updated}</span>
        </div>
        <div class="col-meta">
          <span class="k">Thời gian áp dụng</span>
          <span class="v">${p.fromLabel} — ${p.toLabel}</span>
        </div>
        <span class="status ${isActive ? 'active' : 'inactive'}">
          <span class="dot"></span>${isActive ? 'Active' : 'Inactive'}
        </span>
        <span class="chev">
          <svg width="12" height="8" viewBox="0 0 12 8" fill="none"><path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
      <div class="policy-body" id="body-${i}">
        <div class="policy-body-inner">
          <div class="summary-grid">
            <div class="block">
              <h4>NỘI DUNG CHÍNH</h4>
              <ul>${p.summary.quy.map(x=>`<li>${x}</li>`).join('')}</ul>
              ${renderTable(p.summary.quyTable)}
            </div>
            <div class="block">
              <h4>THÊM</h4>
              <ul>${p.summary.thang.map(x=>`<li>${x}</li>`).join('')}</ul>
            </div>
            <div class="note">${p.summary.note}</div>
            <div class="source-row">
              ${p.pdfUrl
                ? `<a class="pdf-btn" href="${p.pdfUrl}" target="_blank" rel="noopener">
                     <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z" stroke="currentColor" stroke-width="1.6"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.6"/></svg>
                     Xem chính sách gốc (PDF, mở trên Google Drive)
                   </a>`
                : `<span class="pdf-unavailable">Chưa có file gốc đính kèm</span>`
              }
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function setCategory(c){
  activeCategory = c;
  render();
}

function toggle(i){
  const el = document.querySelector(`.policy[data-idx="${i}"]`);
  const body = document.getElementById(`body-${i}`);
  const isOpen = el.classList.contains('is-open');
  if(isOpen){
    body.style.maxHeight = null;
    el.classList.remove('is-open');
  } else {
    el.classList.add('is-open');
    body.style.maxHeight = body.scrollHeight + 'px';
  }
}

render();
</script>
</body>
</html>
